---
# cPanel > Git Version Control > "Deploy HEAD Commit".
# Copia o site para a pasta do domínio SEM apagar nada que já esteja lá
# (plataformafl360, backups, biosite, uploads, .env etc. ficam intactos).
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/maicongoncalves.com.br/
    - /bin/rsync -a --exclude=.git --exclude=.cpanel.yml --exclude=.env ./ $DEPLOYPATH
