; Limites do PHP para envio de fotos e vídeos (painel e Friburgo no Mapa).
; Vale em hospedagens com PHP-FPM. Se não surtir efeito, ajuste os mesmos
; valores em cPanel > MultiPHP INI Editor.
upload_max_filesize = 32M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 90
max_file_uploads = 20
