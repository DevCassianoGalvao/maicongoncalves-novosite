; Limites do PHP para envio de fotos (painel e formulário de contato).
; Vale em hospedagens com PHP-FPM. Se não surtir efeito, ajuste os mesmos
; valores em cPanel > MultiPHP INI Editor.
upload_max_filesize = 16M
post_max_size = 48M
memory_limit = 256M
max_execution_time = 90
max_file_uploads = 20
